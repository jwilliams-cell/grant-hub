<!-- key-handoff (top): a key ring on a leather strap is lowered in from above the frame (the hand stays off frame)
     and lands with weight: the strap gives, the ring swings on the strap and the keys and the paper tag swing on the
     ring with lag (a damped multi-pendulum simulated in fx.js and keyed frame by frame), the keys knocking together.
     On the cue word the blank tag turns to face us (rotateY with perspective) and reads TAG_TEXT, The Dot as its full
     stop. Then the keys are taken: a quick yank up and out, trailing. Every part sits in its own frame (px): the strap
     hangs from the hand at 0,0; each key and the tag hang from their pivot on the ring at 0,0. -->
<div class="kh-rig" data-layout-allow-overflow data-layout-allow-overlap>
  <div class="kh-strap" data-layout-allow-overflow data-layout-allow-overlap>
    <svg class="kh-strap-svg" viewBox="-30 -10 60 360" width="60" height="360">
      <path class="kh-leather" d=""/>
      <path class="kh-stitch" d=""/>
      <circle class="kh-rivet" cx="0" cy="0" r="5.5"/>
    </svg>
    <svg class="kh-ring-svg" viewBox="-40 -40 80 80" width="80" height="80">
      <circle class="kh-ring-o" cx="0" cy="0" r="22"/>
      <circle class="kh-ring-i" cx="0" cy="0" r="22"/>
      <path class="kh-ring-o" d="M -21.2 -8.4 A 23 23 0 0 1 -8.6 -21.4"/>
      <path class="kh-ring-i kh-coil" d="M -21.2 -8.4 A 23 23 0 0 1 -8.6 -21.4"/>

  </div>
  <div class="kh-tag" data-layout-allow-overflow data-layout-allow-overlap>

    </svg>
    <div class="kh-card" data-layout-allow-overflow data-layout-allow-overlap>

        <path class="kh-paper" fill-rule="evenodd" d="M10 0 H194 A10 10 0 0 1 204 10 V106 A10 10 0 0 1 194 116 H10 A10 10 0 0 1 0 106 V10 A10 10 0 0 1 10 0 Z M108.5 13 A6.5 6.5 0 1 0 95.5 13 A6.5 6.5 0 1 0 108.5 13 Z"/>

      </svg>
      <div class="kh-face" data-layout-allow-overflow data-layout-allow-overlap><span class="kh-word" data-layout-allow-overflow data-layout-allow-overlap></span><i class="kh-dot"></i></div>

  </div>

<style>
#{{ID}} .kh-rig { position:absolute; left:0; top:0; width:0; height:0;
  filter:drop-shadow(0 12px 14px color-mix(in srgb, var(--c-ink) 30%, transparent)); }
/* the strap: its frame's 0,0 is the hand (off frame); fx.js sizes the leather and places the ring at its end */
#{{ID}} .kh-strap { position:absolute; left:0; top:0; width:0; height:0; }
#{{ID}} .kh-strap-svg { position:absolute; left:-30px; top:-10px; overflow:visible; }
#{{ID}} .kh-leather { fill:var(--c-dark); }
#{{ID}} .kh-stitch { fill:none; stroke:var(--c-light); stroke-opacity:.55; stroke-width:1.6; stroke-dasharray:6 5; }
#{{ID}} .kh-rivet { fill:var(--c-light); stroke:var(--c-ink); stroke-width:2; }
#{{ID}} .kh-ring-svg { position:absolute; left:-40px; top:-40px; overflow:visible; }
#{{ID}} .kh-ring-o { fill:none; stroke:var(--c-ink); stroke-width:8.5; }
#{{ID}} .kh-ring-i { fill:none; stroke:var(--c-light); stroke-width:4.5; }
#{{ID}} .kh-coil { stroke:color-mix(in srgb, var(--c-light) 82%, var(--c-ink)); }
/* the tag: its frame's 0,0 is where its string loops over the ring */
#{{ID}} .kh-tag { position:absolute; left:0; top:0; width:0; height:0; }
#{{ID}} .kh-string { position:absolute; left:-20px; top:-6px; overflow:visible; }
#{{ID}} .kh-string path { fill:none; stroke:var(--c-ink); stroke-width:2.2; stroke-linecap:round; }
#{{ID}} .kh-card { position:absolute; left:-102px; top:0; width:204px; height:116px; }
#{{ID}} .kh-card-svg { position:absolute; left:0; top:0; overflow:visible; }
#{{ID}} .kh-paper { fill:var(--c-light); stroke:color-mix(in srgb, var(--c-ink) 38%, var(--c-light)); stroke-width:1.5; }
#{{ID}} .kh-reinf { fill:color-mix(in srgb, var(--c-light) 84%, var(--c-ink)); stroke:color-mix(in srgb, var(--c-ink) 45%, var(--c-light)); stroke-width:1.2; }
#{{ID}} .kh-shade { fill:var(--c-ink); opacity:0; }

  align-items:baseline; white-space:nowrap; }
#{{ID}} .kh-word { font-family:var(--font-display); font-style:var(--display-style); font-weight:var(--display-weight);
  font-size:60px; line-height:70px; letter-spacing:-.015em; color:var(--c-ink); }
#{{ID}} .kh-dot { display:block; width:15px; height:15px; margin-left:4px; border-radius:50%; background:var(--c-accent); flex:none; }
/* the keys: each frame's 0,0 is the top of its bow hole, where it hangs on the ring */
#{{ID}} .kh-key { position:absolute; left:0; top:0; width:0; height:0; }
#{{ID}} .kh-key svg { position:absolute; left:-50px; top:-18px; overflow:visible; }
#{{ID}} .kh-metal { stroke:var(--c-ink); stroke-width:1.85; stroke-linejoin:round; }
#{{ID}} .kh-ka .kh-metal { fill:var(--c-light); }
#{{ID}} .kh-kb .kh-metal { fill:color-mix(in srgb, var(--c-light) 84%, var(--c-ink)); }
#{{ID}} .kh-line { fill:none; stroke:var(--c-ink); stroke-width:1.5; stroke-linecap:round; }
#{{ID}} .kh-faint { stroke-opacity:.3; }
</style>
